
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e53935">

<title>González delivery</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff7f5;
  color: #222;
}

header {
  background: #e53935;
  color: white;
  text-align: center;
  padding: 28px 15px;
}

header h1 {
  font-size: 32px;
  margin: 0 0 8px;
}

header p {
  margin: 0;
}

main {
  max-width: 620px;
  margin: 22px auto;
  padding: 0 14px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 5px 24px #00000012;
}

.restaurant {
  background: #fff0ee;
  border: 1px solid #ffd0cc;
  border-radius: 10px;
  padding: 15px;
  font-size: 19px;
  font-weight: bold;
}

label {
  display: block;
  font-weight: bold;
  margin: 17px 0 7px;
}

input,
textarea {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  font-family: Arial, sans-serif;
}

textarea {
  resize: vertical;
}

input:focus,
textarea:focus {
  outline: 2px solid #f5aaa6;
  border-color: #e53935;
}

button {
  width: 100%;
  background: #e53935;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 17px;
  margin-top: 23px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #c62828;
}

.note {
  font-size: 13px;
  color: #666;
  line-height: 1.5;
}

footer {
  text-align: center;
  padding: 20px;
  color: #666;
  font-size: 13px;
}

.error {
  display: none;
  background: #fff0ee;
  border: 1px solid #e53935;
  border-radius: 10px;
  padding: 16px;
}
</style>
</head>

<body>

<header>
  <h1>González delivery 🚚</h1>
  <p>Tu pedido fácil y rápido por WhatsApp</p>
</header>

<main>

<section class="card">

<div id="error" class="error">
  <strong>Restaurante no identificado.</strong>
  <p>
    Solicita tu enlace personalizado a González delivery.
  </p>
</div>

<form id="pedido">

<label>Restaurante</label>

<div id="restauranteNombre" class="restaurant">
  Cargando restaurante...
</div>

<label for="tiempo">
  Tiempo aproximado de preparación
</label>

<input
  type="text"
  id="tiempo"
  placeholder="Ej. 20-30 minutos"
  required
>

<label for="nombre">
  Nombre del cliente
</label>

<input
  type="text"
  id="nombre"
  placeholder="Nombre completo"
  autocomplete="name"
  required
>

<label for="telefono">
  Teléfono del cliente
</label>

<input
  type="tel"
  id="telefono"
  placeholder="Número de teléfono"
  autocomplete="tel"
  required
>

<label for="ubicacion">
  Ubicación o dirección
</label>

<textarea
  id="ubicacion"
  rows="3"
  placeholder="Colonia, calle o punto de referencia"
></textarea>

<label for="detalles">
  Detalles del pedido
</label>

<textarea
  id="detalles"
  rows="4"
  placeholder="Productos, cantidades e indicaciones"
></textarea>

<button type="submit">
  Enviar pedido por WhatsApp 📲
</button>

<p class="note">
  WhatsApp abrirá el pedido preparado.
  Revisa el mensaje y presiona Enviar.
</p>

</form>

</section>

</main>

<footer>
  González delivery 🚚
</footer>

<script>

// =================================
// RESTAURANTES PERSONALIZADOS
// =================================

const restaurantes = {

  "meus-meninos":
    "Meus Meninos🇧🇷",

  "crepe-santa-elena":
    "Crepe Cafe Santa Elena☕️",

  "gabo":
    "Gabo🍖",

  "crepe-parque":
    "Crepe Cafe Parque ☕️",

  "antojitos-santa-elena":
    "Antojitos Santa Elena🥮",

  "magicos-detalles":
    "Magicos Detalles ✨️"

};


// =================================
// IDENTIFICAR RESTAURANTE
// =================================

const parametros =
  new URLSearchParams(window.location.search);

const slug =
  parametros.get("restaurante");

const restaurante =
  restaurantes[slug];

const formulario =
  document.getElementById("pedido");


// =================================
// MOSTRAR NOMBRE PERSONALIZADO
// =================================

if (restaurante) {

  document.getElementById("restauranteNombre")
    .textContent = restaurante;

} else {

  document.getElementById("error")
    .style.display = "block";

  document.getElementById("restauranteNombre")
    .textContent = "Restaurante no identificado";

  formulario.style.display = "none";

}


// =================================
// ENVIAR PEDIDO A WHATSAPP
// =================================

formulario.addEventListener("submit", function(event) {

  event.preventDefault();

  if (!restaurante) {
    return;
  }

  const tiempo =
    document.getElementById("tiempo")
      .value.trim();

  const nombre =
    document.getElementById("nombre")
      .value.trim();

  const telefono =
    document.getElementById("telefono")
      .value.trim();

  const ubicacion =
    document.getElementById("ubicacion")
      .value.trim() || "No indicada";

  const detalles =
    document.getElementById("detalles")
      .value.trim() || "No indicados";


  const mensaje = [

    "🚚 NUEVO PEDIDO",

    "GONZÁLEZ DELIVERY",

    "",

    "🍽️ Restaurante: " + restaurante,

    "⏱️ Tiempo de preparación: " + tiempo,

    "👤 Cliente: " + nombre,

    "📞 Teléfono: " + telefono,

    "📍 Ubicación: " + ubicacion,

    "📝 Detalles del pedido: " + detalles

  ].join("\n");


  const enlaceWhatsApp =
    "https://wa.me/50377896089?text=" +
    encodeURIComponent(mensaje);


  window.location.href = enlaceWhatsApp;

});

</script>

</body>
</html>
